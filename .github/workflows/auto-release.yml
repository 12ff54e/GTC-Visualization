---
name: auto-release-package

on:
  push:
    branches:
      - master

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Set up Emscripten SDK
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build and test FFTE WebAssembly
        run: |
          emcmake cmake -S ffte -B ffte/build-wasm \
            -DFFTE_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ffte/build-wasm --target ffte_wasm --config Release
          mkdir -p ffte/dist public/libs/ffte
          cp ffte/build-wasm/ffte.wasm ffte/dist/ffte.wasm
          cp ffte/dist/ffte.wasm public/libs/ffte/ffte.wasm
          node ffte/tests/test_wasm.mjs

      - name: Build release package
        run: npm run pack

      - uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: false
          title: Auto Packaging
          files: |
            GTC-Visualization.tar.gz
